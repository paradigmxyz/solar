name: Ingest website data

permissions: {}

on:
  workflow_run:
    workflows: [Benchmark]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      historical:
        description: Import all retained Benchmark runs
        required: true
        default: true
        type: boolean

concurrency:
  group: web-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: voidzero-dev/setup-vp@0cffb0a1ac50daa1541b57d1eb7c843f479522e1 # v1.18.0
        with:
          cache: true
          node-version: '24'
          working-directory: web

      - name: Create ClickHouse schema
        working-directory: web
        env:
          CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_DATABASE: ${{ vars.CLICKHOUSE_DATABASE || 'solar_perf' }}
        run: pnpm db:schema

      - name: Ingest benchmark data
        working-directory: web
        env:
          GH_TOKEN: ${{ github.token }}
          CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_DATABASE: ${{ vars.CLICKHOUSE_DATABASE || 'solar_perf' }}
        run: |
          if [[ "${{ github.event_name }}" == workflow_run ]]; then
            pnpm db:backfill -- --workflow-run "${{ github.event.workflow_run.id }}"
          else
            pnpm db:backfill
          fi
