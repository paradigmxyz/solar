name: LSP benchmark PR comment

permissions: {}

on:
  workflow_run:
    workflows: [LSP benchmark PR]
    types: [completed]

concurrency:
  group: >-
    ${{ format('{0}-{1}-{2}', github.workflow,
      github.event.workflow_run.head_repository.full_name,
      github.event.workflow_run.head_branch) }}
  cancel-in-progress: true

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Find pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const workflowPath = ".github/workflows/lsp-bench-pr.yml";
            if (
              run.repository?.full_name !== context.payload.repository.full_name ||
              !(run.path === workflowPath || run.path?.startsWith(`${workflowPath}@`))
            ) {
              core.setFailed(`Unexpected source workflow for run ${run.id}`);
              return;
            }
            if (!run.head_repository?.owner?.login || !run.head_branch) {
              core.setFailed("Workflow run has no pull request head repository or branch");
              return;
            }
            let pullNumber;
            if (Array.isArray(run.pull_requests) && run.pull_requests.length === 1) {
              pullNumber = run.pull_requests[0].number;
            } else {
              const head = `${run.head_repository.owner.login}:${run.head_branch}`;
              const { data: pulls } = await github.rest.pulls.list({
                ...context.repo,
                state: "open",
                head,
              });
              const matches = pulls.filter((candidate) => candidate.head.sha === run.head_sha);
              if (matches.length !== 1) {
                core.setFailed(`Expected one open pull request for ${head} at ${run.head_sha}`);
                return;
              }
              pullNumber = matches[0].number;
            }
            const response = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            const pull = response.data;
            if (
              pull.state !== "open" ||
              pull.head.sha !== run.head_sha ||
              pull.head.ref !== run.head_branch ||
              pull.head.repo?.full_name !== run.head_repository.full_name ||
              pull.base.repo?.full_name !== context.payload.repository.full_name
            ) {
              core.setFailed(`Pull request identity has changed since workflow run ${run.id}`);
              return;
            }
            if (Array.isArray(run.pull_requests) && run.pull_requests.length === 1) {
              const associated = run.pull_requests[0];
              if (
                associated.head.sha !== pull.head.sha ||
                associated.head.ref !== pull.head.ref ||
                associated.head.repo?.id !== pull.head.repo?.id ||
                associated.base.sha !== pull.base.sha ||
                associated.base.ref !== pull.base.ref ||
                associated.base.repo?.id !== pull.base.repo?.id
              ) {
                core.setFailed(`Pull request base or head has changed since workflow run ${run.id}`);
                return;
              }
            }
            core.setOutput("number", pull.number);
            core.setOutput("head_sha", pull.head.sha);
            core.setOutput("head_ref", pull.head.ref);
            core.setOutput("head_repo", pull.head.repo.full_name);
            core.setOutput("base_sha", pull.base.sha);
            core.setOutput("base_ref", pull.base.ref);
            core.setOutput("base_repo", pull.base.repo.full_name);
            core.setOutput("base_source_url", pull.base.repo.clone_url);
            core.setOutput("head_source_url", pull.head.repo.clone_url);

      - name: Checkout trusted comment renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: target/lsp-bench-comment/trusted-source
          persist-credentials: false

      - name: Find exact comparison artifact
        id: artifact
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                ...context.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              },
            );
            const matches = artifacts.filter(
              (artifact) => artifact.name === "lsp-bench-pr-results" && !artifact.expired,
            );
            if (matches.length !== 1) {
              core.warning(`Expected one comparison artifact, found ${matches.length}`);
              return;
            }
            core.setOutput("artifact_id", String(matches[0].id));

      - name: Find immutable baseline artifact
        id: baseline-artifact
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                ...context.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              },
            );
            const matches = artifacts.filter(
              (artifact) => artifact.name === "lsp-bench-pr-baseline-used" && !artifact.expired,
            );
            if (matches.length !== 1) {
              core.warning(`Expected one immutable baseline artifact, found ${matches.length}`);
              return;
            }
            core.setOutput("artifact_id", String(matches[0].id));

      - name: Download benchmark comparison
        id: download
        if: steps.artifact.outputs.artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact_id }}
          path: ${{ runner.temp }}/lsp-bench-results
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download immutable baseline
        id: baseline-download
        if: steps.baseline-artifact.outputs.artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.baseline-artifact.outputs.artifact_id }}
          path: ${{ runner.temp }}/lsp-bench-baseline
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Render trusted benchmark comment
        if: always() && steps.pr.outcome == 'success'
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          BASELINE_DOWNLOAD_OUTCOME: ${{ steps.baseline-download.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SOURCE_URL: ${{ steps.pr.outputs.base_source_url }}
          HEAD_SOURCE_URL: ${{ steps.pr.outputs.head_source_url }}
        run: |
          set -euo pipefail
          args=(
            --expected-baseline-revision "$BASE_SHA"
            --expected-candidate-revision "$HEAD_SHA"
            --expected-baseline-source-url "$BASE_SOURCE_URL"
            --expected-candidate-source-url "$HEAD_SOURCE_URL"
            --expected-threshold-pct 10
            --expected-min-samples 2
            --output target/lsp-bench-comment/report.md
          )
          if [[ "$DOWNLOAD_OUTCOME" == success &&
                "$BASELINE_DOWNLOAD_OUTCOME" == success ]]; then
            args+=(
              --input "$RUNNER_TEMP/lsp-bench-results/comparison.json"
              --baseline-summary "$RUNNER_TEMP/lsp-bench-baseline/summary.json"
              --candidate-summary "$RUNNER_TEMP/lsp-bench-results/current/summary.json"
            )
          fi
          python3 target/lsp-bench-comment/trusted-source/.github/scripts/lsp-bench-pr-comment.py \
            "${args[@]}"

      - name: Recheck pull request identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          BASE_REPO: ${{ steps.pr.outputs.base_repo }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (
              pull.state !== "open" ||
              pull.head.sha !== process.env.HEAD_SHA ||
              pull.head.ref !== process.env.HEAD_REF ||
              pull.head.repo?.full_name !== process.env.HEAD_REPO ||
              pull.base.sha !== process.env.BASE_SHA ||
              pull.base.ref !== process.env.BASE_REF ||
              pull.base.repo?.full_name !== process.env.BASE_REPO
            ) {
              core.setFailed("Pull request base or head changed before the benchmark comment was posted");
            }

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: lsp-bench-pr
          path: target/lsp-bench-comment/report.md
          number_force: ${{ steps.pr.outputs.number }}
