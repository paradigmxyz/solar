name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SOLC_VERSION: 0.8.38
  FANDANGO_VERSION: 1.1.1

jobs:
  evm-rules:
    name: EVM word and stack proofs
    runs-on: depot-ubuntu-latest-8
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select proof checks
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only HEAD^1 HEAD -- crates/codegen/isle scripts/evm-rules .github/scripts/install_lean.sh .github/workflows/ci.yml .python-version pyproject.toml uv.lock)
            if [[ -n "$changed" ]]; then
              echo 'run=true' >> "$GITHUB_OUTPUT"
            else
              echo 'Proof inputs unchanged; skipping Lean proofs.'
            fi
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.select.outputs.run == 'true'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.select.outputs.run == 'true'
        with:
          path: |
            ${{ runner.temp }}/solar-lean/*.tar.zst
            scripts/evm-rules/lean/.lake
          key: lean-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/evm-rules/lean/**/*.lean', 'scripts/evm-rules/lean/lakefile.toml', 'scripts/evm-rules/lean/lake-manifest.json', 'scripts/evm-rules/lean/lean-toolchain') }}
          restore-keys: |
            lean-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Lean
        if: steps.select.outputs.run == 'true'
        run: bash .github/scripts/install_lean.sh
      - name: Verify rules
        if: steps.select.outputs.run == 'true'
        run: uv run scripts/evm-rules/verify.py verify
      - name: Upload failed proof diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evm-proofs
          path: target/evm-rules
          if-no-files-found: ignore
          retention-days: 7

  test:
    if: github.event_name != 'schedule'
    name: test ${{ matrix.os }} ${{ matrix.rust }}${{ matrix.features && format(' ({0})', matrix.features) || '' }}
    runs-on: depot-${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        rust: ["stable"]
        include:
          - os: "ubuntu-latest"
            rust: "1.98" # MSRV
          - os: "ubuntu-latest"
            rust: "nightly"
          # Run both nightly configurations in parallel.
          - os: "ubuntu-latest"
            rust: "nightly"
            features: "nightly"
        exclude:
          # Only pushes to main and manual runs test every OS.
          - os: "macos-latest"
            rust: ${{ contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && 'none' || 'stable' }}
          - os: "windows-latest"
            rust: ${{ contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && 'none' || 'stable' }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Checkout submodules
        run: git submodule update --checkout
      - name: Install LLVM (apt)
        if: matrix.os == 'ubuntu-latest'
        run: .github/scripts/install_llvm.sh ubuntu
      - name: Install LLVM (brew)
        if: matrix.os == 'macos-latest'
        run: .github/scripts/install_llvm.sh macos
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: matrix.os == 'windows-latest'
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-llvm
      - name: FileCheck
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          filecheck="$(command -v FileCheck)"
          "$filecheck" --version
          echo "FILECHECK=$(cygpath -w "$filecheck")" >> "$GITHUB_ENV"
      - name: llvm-config
        if: matrix.os != 'windows-latest'
        run: llvm-config --version --bindir --libdir
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: ${{ matrix.rust }}
      - name: Install nextest
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          tool: nextest@0.9.140
          checksum: true
          fallback: none
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
      - name: test
        run: cargo nextest run --profile ci --workspace --features "${{ matrix.features || '' }}"
        env:
          # Also runs every `run-call` on the scheduled runtime EVM IR through the EVM IR
          # interpreter, which must agree with the EVM. The check does not depend on the host, so
          # one job runs it.
          SOLAR_RUN_CALL_EVM_IR: ${{ matrix.os == 'ubuntu-latest' && matrix.rust == 'stable' && '1' || '' }}
      - name: test C API
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: ./crates/capi/test
      - name: doctest
        run: cargo test --doc --workspace --features "${{ matrix.features || '' }}"

  python:
    if: github.event_name != 'schedule'
    name: Python
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/solar-lean/*.tar.zst
            scripts/evm-rules/lean/.lake
          key: lean-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/evm-rules/lean/**/*.lean', 'scripts/evm-rules/lean/lakefile.toml', 'scripts/evm-rules/lean/lake-manifest.json', 'scripts/evm-rules/lean/lean-toolchain') }}
          restore-keys: |
            lean-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Lean
        run: bash .github/scripts/install_lean.sh
      - name: Python checks and tests
        run: bash scripts/check-python.sh

  fandango:
    if: github.event_name != 'schedule'
    name: fandango
    runs-on: depot-ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    env:
      UV_HTTP_TIMEOUT: "120"
      FANDANGO_ABI_SEED_COUNT: ${{ github.event_name == 'schedule' && '8' || '3' }}
      FANDANGO_ABI_VALUES_PER_SEED: ${{ github.event_name == 'schedule' && '64' || '32' }}
      FANDANGO_MAX_ABI_VECTORS: ${{ github.event_name == 'schedule' && '768' || '160' }}
      FANDANGO_SOURCE_COUNT: ${{ github.event_name == 'schedule' && '128' || '32' }}
      FANDANGO_RUNTIME_SOURCE_COUNT: ${{ github.event_name == 'schedule' && '64' || '16' }}
      FANDANGO_SOLSMITH_COUNT: ${{ github.event_name == 'schedule' && '64' || '16' }}
      FANDANGO_RUNTIME_CASES: ${{ github.event_name == 'schedule' && '16' || '8' }}
      FANDANGO_FOUNDRY_TARGETS: ${{ github.event_name == 'schedule' && '8' || '2' }}
      FANDANGO_FOUNDRY_FUZZ_RUNS: ${{ github.event_name == 'schedule' && '256' || '64' }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Checkout submodules
        run: git submodule update --checkout
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Fandango and Foundry runtime differentials
        run: .github/scripts/run_fandango_checks.sh
      - name: Upload Fandango artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fandango-runtime-fuzz
          path: target/runtime-fuzz
          if-no-files-found: ignore

  solsymdiff:
    if: github.event_name != 'schedule'
    name: solsymdiff
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
      # The symbolic precompile fixes (foundry-rs/foundry#17821, #17825) are not
      # in a stable release yet.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: nightly
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Solc and Bitwuzla
        run: |
          mkdir -p "$RUNNER_TEMP/solc" "$RUNNER_TEMP/bitwuzla"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/ethereum/solidity/releases/download/v${SOLC_VERSION}/solc-static-linux" \
            -o "$RUNNER_TEMP/solc/solc"
          chmod +x "$RUNNER_TEMP/solc/solc"
          echo "SOLC=$RUNNER_TEMP/solc/solc" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/bitwuzla/bitwuzla/releases/download/${BITWUZLA_VERSION}/Bitwuzla-Linux-x86_64-static.zip" \
            -o "$RUNNER_TEMP/bitwuzla/bitwuzla.zip"
          echo "${BITWUZLA_SHA256}  $RUNNER_TEMP/bitwuzla/bitwuzla.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bitwuzla/bitwuzla.zip" -d "$RUNNER_TEMP/bitwuzla"
          echo "$RUNNER_TEMP/bitwuzla/Bitwuzla-Linux-x86_64-static/bin" >> "$GITHUB_PATH"
        env:
          BITWUZLA_VERSION: 0.9.1
          BITWUZLA_SHA256: 057f1546ae2068df57beb178f3eeab1678f0e5f0c378787a05b7bb294617c9c6
      - name: Build Solar
        run: cargo build -p solar-compiler --bin solar
      - name: Symbolic differential smoke test
        run: .github/scripts/run_solsymdiff_smoke.sh
        env:
          SOLVER: bitwuzla
      - name: Upload solsymdiff results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solsymdiff
          path: target/solsymdiff-smoke/*.json
          if-no-files-found: ignore

  solsymdiff-campaign:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: solsymdiff campaign
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 360
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
      # The symbolic precompile fixes (foundry-rs/foundry#17821, #17825) are not
      # in a stable release yet.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: nightly
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Solc and z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3
          mkdir -p "$RUNNER_TEMP/solc"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/ethereum/solidity/releases/download/v${SOLC_VERSION}/solc-static-linux" \
            -o "$RUNNER_TEMP/solc/solc"
          chmod +x "$RUNNER_TEMP/solc/solc"
          echo "SOLC=$RUNNER_TEMP/solc/solc" >> "$GITHUB_ENV"
      - name: Build Solar
        run: cargo build -p solar-compiler --bin solar
      - name: Symbolic differential harness self-test
        run: .github/scripts/run_solsymdiff_smoke.sh
        env:
          SOLSYMDIFF_SELF_TEST: 1
      - name: Symbolic differential campaign
        if: ${{ !cancelled() }}
        run: .github/scripts/run_solsymdiff_campaign.sh
      - name: Upload solsymdiff results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solsymdiff-campaign
          path: |
            target/solsymdiff-smoke/*.json
            target/solsymdiff-campaign/*.jsonl
            target/solsymdiff-campaign/*.md
          if-no-files-found: ignore

  feature-checks:
    if: github.event_name != 'schedule'
    name: features
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: nightly
      - name: Install cargo-hack
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          tool: cargo-hack@0.6.45
          checksum: true
          fallback: none
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
      - name: cargo hack
        run: cargo hack check --feature-powerset --depth 1

  wasm:
    if: github.event_name != 'schedule'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
      - name: build wasm
        run: scripts/wasm/dist-wasm.sh
      - name: test soljson
        run: node crates/capi/tests/soljson.js

  typos:
    if: github.event_name != 'schedule'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  clippy:
    if: github.event_name != 'schedule'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: nightly
          components: clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
      - run: cargo clippy --workspace --all-targets
        env:
          RUSTFLAGS: -Dwarnings

  docs:
    if: github.event_name != 'schedule'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: nightly
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings -Zunstable-options --show-type-layout --generate-link-to-definition

  fmt:
    if: github.event_name != 'schedule'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt --all --check

  codeql:
    if: github.event_name != 'schedule'
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{matrix.language}}"

  deny:
    if: github.event_name != 'schedule'
    uses: tempoxyz/gh-actions/.github/workflows/rust-deny.yml@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
    permissions:
      contents: read
      id-token: write
    with:
      rust-toolchain: nightly

  ci-success:
    name: ci success
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'schedule'
    permissions: {}
    needs:
      - evm-rules
      - test
      - python
      - feature-checks
      - wasm
      - typos
      - clippy
      - docs
      - fmt
      - deny
      - solsymdiff
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
