name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      proof-audit:
        description: Bypass the proof cache and replay every query with cvc5
        type: boolean
        default: true
  schedule:
    - cron: '0 4 * * 0'

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SOLC_VERSION: 0.8.37
  FANDANGO_VERSION: 1.1.1

jobs:
  evm-rules:
    name: EVM word and stack proofs
    runs-on: depot-ubuntu-24.04-arm-32
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@48ff2b0c97ede86c9f10d105424380b9605f790d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Select proof checks
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only HEAD^1 HEAD -- crates/codegen scripts/evm-rules .github/scripts/run_evm_proofs.sh .github/workflows/ci.yml .python-version pyproject.toml uv.lock)
            if [[ -n "$changed" ]]; then
              echo 'run=true' >> "$GITHUB_OUTPUT"
            else
              echo 'Proof inputs unchanged; skipping solver checks.'
            fi
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.select.outputs.run == 'true' && github.event_name != 'schedule' && !inputs.proof-audit
        with:
          path: target/evm-proof-cache
          key: proof-queries-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/evm-rules/evm_rules/solver.py', '.python-version', 'uv.lock') }}-${{ github.sha }}
          restore-keys: |
            proof-queries-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/evm-rules/evm_rules/solver.py', '.python-version', 'uv.lock') }}-
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.select.outputs.run == 'true'
      - name: Install cvc5 1.2.0
        if: steps.select.outputs.run == 'true'
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/cvc5/cvc5/releases/download/cvc5-1.2.0/cvc5-Linux-arm64-static.zip \
            --output "$RUNNER_TEMP/cvc5.zip"
          echo "142ac177af1ce37922308f69fe519d06e6cb4d0a62a312f28c25001e94c2fb56  $RUNNER_TEMP/cvc5.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/cvc5.zip" -d "$RUNNER_TEMP/cvc5"
          echo "$RUNNER_TEMP/cvc5/cvc5-Linux-arm64-static/bin" >> "$GITHUB_PATH"
      - name: Verify rules
        if: steps.select.outputs.run == 'true'
        env:
          PROOF_AUDIT: ${{ (github.event_name == 'schedule' || inputs.proof-audit) && 'true' || 'false' }}
        run: bash .github/scripts/run_evm_proofs.sh
      - name: Share successful query cache
        if: steps.select.outputs.run == 'true' && github.event_name != 'schedule' && !inputs.proof-audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evm-proof-cache
          path: target/evm-proof-cache
          if-no-files-found: error
          retention-days: 7
      - name: Upload failed proof diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evm-proofs
          path: target/evm-rules
          if-no-files-found: ignore
          retention-days: 7

  test:
    if: github.event_name != 'schedule'
    name: test ${{ matrix.os }} ${{ matrix.rust }}
    runs-on: depot-${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        rust: ["stable"]
        include:
          - os: "ubuntu-latest"
            rust: "1.96" # MSRV
          - os: "ubuntu-latest"
            rust: "nightly"
        exclude:
          - os: "macos-latest"
            rust: ${{ github.event_name == 'push' && 'none' || 'stable' }}
          - os: "windows-latest"
            rust: ${{ github.event_name == 'push' && 'none' || 'stable' }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@48ff2b0c97ede86c9f10d105424380b9605f790d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Checkout submodules
        run: git submodule update --checkout
      - name: Install LLVM (apt)
        if: matrix.os == 'ubuntu-latest'
        run: .github/scripts/install_llvm.sh ubuntu
      - name: Install LLVM (brew)
        if: matrix.os == 'macos-latest'
        run: .github/scripts/install_llvm.sh macos
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        if: matrix.os == 'windows-latest'
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-llvm
      - name: FileCheck
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          filecheck="$(command -v FileCheck)"
          "$filecheck" --version
          echo "FILECHECK=$(cygpath -w "$filecheck")" >> "$GITHUB_ENV"
      - name: llvm-config
        if: matrix.os != 'windows-latest'
        run: llvm-config --version --bindir --libdir
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Install nextest
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@48ff2b0c97ede86c9f10d105424380b9605f790d
        with:
          tool: nextest@0.9.140
          checksum: true
          fallback: none
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-on-failure: true
          cache-targets: false
      - name: build
        run: cargo build
      - name: test
        run: cargo nextest run --profile ci --workspace
      - name: test C API
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: ./crates/capi/test
      - name: test --features nightly
        if: matrix.rust == 'nightly'
        run: cargo nextest run --profile ci --workspace --features nightly
      - name: doctest
        run: cargo test --doc --workspace

  python:
    if: github.event_name != 'schedule'
    name: Python
    runs-on: depot-ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@48ff2b0c97ede86c9f10d105424380b9605f790d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install cvc5 1.2.0
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/cvc5/cvc5/releases/download/cvc5-1.2.0/cvc5-Linux-arm64-static.zip \
            --output "$RUNNER_TEMP/cvc5.zip"
          echo "142ac177af1ce37922308f69fe519d06e6cb4d0a62a312f28c25001e94c2fb56  $RUNNER_TEMP/cvc5.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/cvc5.zip" -d "$RUNNER_TEMP/cvc5"
          echo "$RUNNER_TEMP/cvc5/cvc5-Linux-arm64-static/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cvc5/cvc5-Linux-arm64-static/bin/cvc5" --version
      - name: Python checks and tests
        run: bash scripts/check-python.sh

  fandango:
    if: github.event_name != 'schedule'
    name: fandango
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    env:
      UV_HTTP_TIMEOUT: "120"
      FANDANGO_ABI_SEED_COUNT: ${{ github.event_name == 'schedule' && '8' || '3' }}
      FANDANGO_ABI_VALUES_PER_SEED: ${{ github.event_name == 'schedule' && '64' || '32' }}
      FANDANGO_MAX_ABI_VECTORS: ${{ github.event_name == 'schedule' && '768' || '160' }}
      FANDANGO_SOURCE_COUNT: ${{ github.event_name == 'schedule' && '128' || '32' }}
      FANDANGO_RUNTIME_SOURCE_COUNT: ${{ github.event_name == 'schedule' && '64' || '16' }}
      FANDANGO_SOLSMITH_COUNT: ${{ github.event_name == 'schedule' && '64' || '16' }}
      FANDANGO_RUNTIME_CASES: ${{ github.event_name == 'schedule' && '16' || '8' }}
      FANDANGO_FOUNDRY_TARGETS: ${{ github.event_name == 'schedule' && '8' || '2' }}
      FANDANGO_FOUNDRY_FUZZ_RUNS: ${{ github.event_name == 'schedule' && '256' || '64' }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@48ff2b0c97ede86c9f10d105424380b9605f790d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Checkout submodules
        run: git submodule update --checkout
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-on-failure: true
          cache-targets: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Fandango and Foundry runtime differentials
        run: .github/scripts/run_fandango_checks.sh
      - name: Upload Fandango artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fandango-runtime-fuzz
          path: target/runtime-fuzz
          if-no-files-found: ignore

  feature-checks:
    if: github.event_name != 'schedule'
    name: features
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@48ff2b0c97ede86c9f10d105424380b9605f790d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      - name: Install cargo-hack
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@48ff2b0c97ede86c9f10d105424380b9605f790d
        with:
          tool: cargo-hack@0.6.45
          checksum: true
          fallback: none
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-on-failure: true
          cache-targets: false
      - name: cargo hack
        run: cargo hack check --feature-powerset --depth 1

  wasm:
    if: github.event_name != 'schedule'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@48ff2b0c97ede86c9f10d105424380b9605f790d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-on-failure: true
          cache-targets: false
      - name: build wasm
        run: scripts/wasm/dist-wasm.sh
      - name: test soljson
        run: node crates/capi/tests/soljson.js

  typos:
    if: github.event_name != 'schedule'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@48ff2b0c97ede86c9f10d105424380b9605f790d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1

  clippy:
    if: github.event_name != 'schedule'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@48ff2b0c97ede86c9f10d105424380b9605f790d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
          components: clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-on-failure: true
          cache-targets: false
      - run: cargo clippy --workspace --all-targets
        env:
          RUSTFLAGS: -Dwarnings

  docs:
    if: github.event_name != 'schedule'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@48ff2b0c97ede86c9f10d105424380b9605f790d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-on-failure: true
          cache-targets: false
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings -Zunstable-options --show-type-layout --generate-link-to-definition

  fmt:
    if: github.event_name != 'schedule'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@48ff2b0c97ede86c9f10d105424380b9605f790d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt --all --check

  codeql:
    if: github.event_name != 'schedule'
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@48ff2b0c97ede86c9f10d105424380b9605f790d
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{matrix.language}}"

  deny:
    if: github.event_name != 'schedule'
    name: cargo deny check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: ""
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@48ff2b0c97ede86c9f10d105424380b9605f790d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - name: Install cargo-deny
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@48ff2b0c97ede86c9f10d105424380b9605f790d
        with:
          tool: cargo-deny@0.20.2
          checksum: true
          fallback: none
      - run: cargo deny --all-features check all

  ci-success:
    name: ci success
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'schedule'
    permissions: {}
    needs:
      - evm-rules
      - test
      - python
      - feature-checks
      - wasm
      - typos
      - clippy
      - docs
      - fmt
      - deny
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
