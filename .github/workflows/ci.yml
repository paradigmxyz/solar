name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SOLC_VERSION: 0.8.37
  FANDANGO_VERSION: 1.1.1

jobs:
  evm-rules:
    name: EVM word and stack proofs
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select proof checks
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only HEAD^1 HEAD -- crates/codegen scripts/evm-rules .github/scripts/install_lean.sh .github/workflows/ci.yml .python-version pyproject.toml uv.lock)
            if [[ -n "$changed" ]]; then
              echo 'run=true' >> "$GITHUB_OUTPUT"
            else
              echo 'Proof inputs unchanged; skipping Lean proofs.'
            fi
          fi
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.select.outputs.run == 'true'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.select.outputs.run == 'true'
        with:
          path: |
            ${{ runner.temp }}/solar-lean/*.tar.zst
            scripts/evm-rules/lean/.lake
          key: lean-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/evm-rules/lean/**/*.lean', 'scripts/evm-rules/lean/lakefile.toml', 'scripts/evm-rules/lean/lake-manifest.json', 'scripts/evm-rules/lean/lean-toolchain') }}
          restore-keys: |
            lean-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Lean
        if: steps.select.outputs.run == 'true'
        run: bash .github/scripts/install_lean.sh
      - name: Verify rules
        if: steps.select.outputs.run == 'true'
        run: uv run scripts/evm-rules/verify.py verify
      - name: Upload failed proof diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evm-proofs
          path: target/evm-rules
          if-no-files-found: ignore
          retention-days: 7

  test:
    if: github.event_name != 'schedule'
    name: test ${{ matrix.os }} ${{ matrix.rust }}${{ matrix.features && format(' ({0})', matrix.features) || '' }}
    runs-on: depot-${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        rust: ["stable"]
        include:
          - os: "ubuntu-latest"
            rust: "1.98" # MSRV
          - os: "ubuntu-latest"
            rust: "nightly"
          # Run both nightly configurations in parallel.
          - os: "ubuntu-latest"
            rust: "nightly"
            features: "nightly"
        exclude:
          - os: "macos-latest"
            rust: ${{ github.event_name == 'push' && 'none' || 'stable' }}
          - os: "windows-latest"
            rust: ${{ github.event_name == 'push' && 'none' || 'stable' }}
    env:
      LLVM_SYS_211_PREFIX: ${{ github.workspace }}/target/evm-llvm
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Checkout submodules
        run: git submodule update --checkout
      - name: Install LLVM (apt)
        if: matrix.os == 'ubuntu-latest'
        run: .github/scripts/install_llvm.sh ubuntu
      - name: Install LLVM (brew)
        if: matrix.os == 'macos-latest'
        run: .github/scripts/install_llvm.sh macos
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: matrix.os == 'windows-latest'
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-llvm
      - name: FileCheck
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          filecheck="$(command -v FileCheck)"
          "$filecheck" --version
          echo "FILECHECK=$(cygpath -w "$filecheck")" >> "$GITHUB_ENV"
      - name: llvm-config
        if: matrix.os != 'windows-latest'
        run: llvm-config --version --bindir --libdir
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: ${{ matrix.rust }}
      - name: Install nextest
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          tool: nextest@0.9.140
          checksum: true
          fallback: none
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
      - uses: ./.github/actions/setup-evm-llvm
      - name: Install solc for Yul backend tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-ARM64) asset=solc-static-linux-arm ;;
            Linux-*) asset=solc-static-linux ;;
            macOS-*) asset=solc-macos ;;
            Windows-*) asset=solc-windows.exe ;;
          esac
          gh release download "v$SOLC_VERSION" -R argotorg/solidity -p "$asset" -D "$RUNNER_TEMP/solc"
          chmod +x "$RUNNER_TEMP/solc/$asset"
          echo "SOLAR_SOLC=$RUNNER_TEMP/solc/$asset" >> "$GITHUB_ENV"
      - name: build
        run: cargo build --features "${{ matrix.features || '' }}"
      - name: test
        run: cargo nextest run --profile ci --workspace --features "${{ matrix.features || '' }}"
      - name: test C API
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: ./crates/capi/test
      - name: doctest
        run: cargo test --doc --workspace --features "${{ matrix.features || '' }}"

  python:
    if: github.event_name != 'schedule'
    name: Python
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/solar-lean/*.tar.zst
            scripts/evm-rules/lean/.lake
          key: lean-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/evm-rules/lean/**/*.lean', 'scripts/evm-rules/lean/lakefile.toml', 'scripts/evm-rules/lean/lake-manifest.json', 'scripts/evm-rules/lean/lean-toolchain') }}
          restore-keys: |
            lean-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Lean
        run: bash .github/scripts/install_lean.sh
      - name: Python checks and tests
        run: bash scripts/check-python.sh

  fandango:
    if: github.event_name != 'schedule'
    name: fandango
    runs-on: depot-ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    env:
      LLVM_SYS_211_PREFIX: ${{ github.workspace }}/target/evm-llvm
      UV_HTTP_TIMEOUT: "120"
      FANDANGO_ABI_SEED_COUNT: ${{ github.event_name == 'schedule' && '8' || '3' }}
      FANDANGO_ABI_VALUES_PER_SEED: ${{ github.event_name == 'schedule' && '64' || '32' }}
      FANDANGO_MAX_ABI_VECTORS: ${{ github.event_name == 'schedule' && '768' || '160' }}
      FANDANGO_SOURCE_COUNT: ${{ github.event_name == 'schedule' && '128' || '32' }}
      FANDANGO_RUNTIME_SOURCE_COUNT: ${{ github.event_name == 'schedule' && '64' || '16' }}
      FANDANGO_SOLSMITH_COUNT: ${{ github.event_name == 'schedule' && '64' || '16' }}
      FANDANGO_RUNTIME_CASES: ${{ github.event_name == 'schedule' && '16' || '8' }}
      FANDANGO_FOUNDRY_TARGETS: ${{ github.event_name == 'schedule' && '8' || '2' }}
      FANDANGO_FOUNDRY_FUZZ_RUNS: ${{ github.event_name == 'schedule' && '256' || '64' }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Checkout submodules
        run: git submodule update --checkout
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: ./.github/actions/setup-evm-llvm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Fandango and Foundry runtime differentials
        run: .github/scripts/run_fandango_checks.sh
      - name: Upload Fandango artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fandango-runtime-fuzz
          path: target/runtime-fuzz
          if-no-files-found: ignore

  feature-checks:
    if: github.event_name != 'schedule'
    name: features
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
    env:
      LLVM_SYS_211_PREFIX: ${{ github.workspace }}/target/evm-llvm
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: nightly
      - name: Install cargo-hack
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          tool: cargo-hack@0.6.45
          checksum: true
          fallback: none
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
      - uses: ./.github/actions/setup-evm-llvm
      - name: cargo hack
        run: cargo hack check --feature-powerset --depth 1

  wasm:
    if: github.event_name != 'schedule'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
      - name: build wasm
        run: scripts/wasm/dist-wasm.sh
      - name: test soljson
        run: node crates/capi/tests/soljson.js

  typos:
    if: github.event_name != 'schedule'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

  clippy:
    if: github.event_name != 'schedule'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
    env:
      LLVM_SYS_211_PREFIX: ${{ github.workspace }}/target/evm-llvm
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: nightly
          components: clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
      - uses: ./.github/actions/setup-evm-llvm
      - run: cargo clippy --workspace --all-targets
        env:
          RUSTFLAGS: -Dwarnings

  docs:
    if: github.event_name != 'schedule'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
    env:
      LLVM_SYS_211_PREFIX: ${{ github.workspace }}/target/evm-llvm
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: nightly
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
      - uses: ./.github/actions/setup-evm-llvm
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings -Zunstable-options --show-type-layout --generate-link-to-definition

  fmt:
    if: github.event_name != 'schedule'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt --all --check

  codeql:
    if: github.event_name != 'schedule'
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{matrix.language}}"

  deny:
    if: github.event_name != 'schedule'
    uses: tempoxyz/gh-actions/.github/workflows/rust-deny.yml@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
    permissions:
      contents: read
      id-token: write
    with:
      rust-toolchain: nightly

  ci-success:
    name: ci success
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'schedule'
    permissions: {}
    needs:
      - evm-rules
      - test
      - python
      - feature-checks
      - wasm
      - typos
      - clippy
      - docs
      - fmt
      - deny
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
