name: Authoritative Solidity LSP benchmark

permissions: {}

on:
  workflow_dispatch:

concurrency:
  group: lsp-bench-authoritative
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: strict cross-server comparison
    runs-on: [self-hosted, linux, x64, lsp-bench]
    timeout-minutes: 720
    permissions:
      contents: read
    steps:
      - name: Checkout Solar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.96"

      - name: Check dedicated runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          for command in cargo curl git ip jq lscpu node npm python3 rustc sha256sum tar unshare; do
            command -v "$command"
          done
          python3 -m pip --version
          python3 -m venv "$RUNNER_TEMP/lsp-bench-venv-check"
          "$RUNNER_TEMP/lsp-bench-venv-check/bin/pip" --version

      - name: Probe authoritative isolation and accounting
        shell: bash
        run: .github/scripts/lsp-bench-probe.sh

      - name: Build benchmark harness
        run: cargo build --locked -p solar-lsp-bench

      - name: Prepare all pinned servers and fixtures
        run: target/debug/solar-lsp-bench prepare

      - name: Audit publication environment
        run: target/debug/solar-lsp-bench doctor --publish | tee target/lsp-bench/doctor-publish.txt

      - name: Record publication provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/lsp-bench/provenance
          {
            echo "repository=$(git rev-parse HEAD)"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_environment=self-hosted-authoritative"
            uname -a
            lscpu
            rustc --version --verbose
            cargo --version --verbose
            node --version
            npm --version
            python3 --version
            python3 -m pip --version
            sha256sum \
              tools/lsp-bench/benchmark.yaml \
              tools/lsp-bench/servers.lock.yaml \
              tools/lsp-bench/fixtures.lock.yaml
          } > target/lsp-bench/provenance/host-tool.txt
          npm --prefix target/lsp-bench/servers/nomic-foundation ls --all --json \
            > target/lsp-bench/provenance/nomic-foundation-npm-tree.json
          npm --prefix target/lsp-bench/servers/juan-blanco ls --all --json \
            > target/lsp-bench/provenance/juan-blanco-npm-tree.json
          npm --prefix target/lsp-bench/servers/qiuxiang ls --all --json \
            > target/lsp-bench/provenance/qiuxiang-npm-tree.json
          target/lsp-bench/servers/wake/venv/bin/pip freeze --all \
            > target/lsp-bench/provenance/wake-python-packages.txt

      - name: Run strict cross-server comparison
        run: |
          set -euo pipefail
          target/debug/solar-lsp-bench run \
            --profile publish \
            --output target/lsp-bench/authoritative

      - name: Require authoritative complete result
        shell: bash
        run: |
          set -euo pipefail
          summary=target/lsp-bench/authoritative/summary.json
          test -f "$summary"
          target/debug/solar-lsp-bench validate-results \
            --config tools/lsp-bench/benchmark.yaml \
            --input target/lsp-bench/authoritative \
            --profile publish \
            --require-authoritative
          jq -e -f .github/scripts/lsp-bench-authoritative-validate.jq "$summary"

      - name: Generate human-readable comparison
        run: >-
          target/debug/solar-lsp-bench report
          --input target/lsp-bench/authoritative/summary.json
          --output target/lsp-bench/authoritative/COMPARISON.md
          --require-authoritative

      - name: Write immutable artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest=target/lsp-bench/authoritative/artifact-manifest.sha256
          for required in \
            target/lsp-bench/authoritative/samples.json \
            target/lsp-bench/authoritative/samples.jsonl \
            target/lsp-bench/authoritative/summary.json \
            target/lsp-bench/authoritative/summary.md \
            target/lsp-bench/authoritative/COMPARISON.md; do
            test -s "$required"
          done
          export LC_ALL=C
          (
            find target/lsp-bench/authoritative target/lsp-bench/probe \
              target/lsp-bench/provenance tools/lsp-bench/install \
              -type f ! -name artifact-manifest.sha256 -print0 \
              | sort -z \
              | xargs -0 sha256sum
            sha256sum target/lsp-bench/doctor-publish.txt \
              tools/lsp-bench/benchmark.yaml \
              tools/lsp-bench/servers.lock.yaml \
              tools/lsp-bench/fixtures.lock.yaml
          ) > "$manifest"

      - name: Upload authoritative comparison artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solidity-lsp-benchmark-authoritative-${{ github.run_id }}
          path: |
            target/lsp-bench/authoritative/
            target/lsp-bench/probe/
            target/lsp-bench/doctor-publish.txt
            target/lsp-bench/provenance/
            tools/lsp-bench/install/
            tools/lsp-bench/benchmark.yaml
            tools/lsp-bench/servers.lock.yaml
            tools/lsp-bench/fixtures.lock.yaml
          retention-days: 90
          if-no-files-found: error
