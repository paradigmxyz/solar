name: Publish crates

# Publishes every crate to crates.io with trusted publishing (OIDC), without an API token.
# `release.yml` calls this workflow after it creates the GitHub release, so crates.io must
# trust `release.yml` (the calling workflow) and the `crates-io` environment.

permissions: {}

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-22.04
    environment: crates-io
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup update "1.100.0" --no-self-update && rustup default "1.100.0"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # `cargo publish --workspace` fails on a version that is already on crates.io, so publish
      # only the crates that are missing and a failed run can be rerun. Cargo orders the selected
      # crates by dependency and waits for each to reach the index. The tagged commit already
      # passed CI and the release build, so skip the verification build.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish == null) | "\(.name) \(.version)"' > "$RUNNER_TEMP/crates.txt"
          packages=()
          while read -r name version; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' -A "paradigmxyz/solar release workflow" "https://crates.io/api/v1/crates/$name/$version")
            case "$status" in
              200) echo "$name@$version is already on crates.io" ;;
              404) packages+=(-p "$name") ;;
              *) echo "::error::crates.io answered HTTP $status for $name@$version"; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/crates.txt"
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "Every crate is already published."
            exit 0
          fi
          cargo publish --locked --no-verify "${packages[@]}"
