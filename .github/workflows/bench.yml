name: Benchmark

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Benchmark family to run
        required: true
        default: all
        type: choice
        options:
          - all
          - codegen-runtime
          - codspeed
          - gungraun
      comparison_ref:
        description: Git ref to use as the Gungraun baseline
        required: true
        default: main
        type: string
      solc_version:
        description: solc release used by the codegen runtime benchmark
        required: true
        default: 0.8.36
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SOLC_VERSION: ${{ inputs.solc_version || '0.8.36' }}

jobs:
  codegen-runtime:
    name: codegen runtime benchmark
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.benchmark == 'all' ||
      inputs.benchmark == 'codegen-runtime'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.base_ref || 'main' }}
    steps:
      - name: Checkout Solar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test benchmark scripts
        run: |
          python3 -m venv "$RUNNER_TEMP/schema-test"
          "$RUNNER_TEMP/schema-test/bin/pip" install jsonschema==4.25.1
          "$RUNNER_TEMP/schema-test/bin/python" -m unittest discover \
            -s benches/runtime -p 'test_*.py'

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          cache-on-failure: true
          cache-targets: false

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable

      - name: Install solc
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/solc"
          curl -fsSL \
            "https://github.com/ethereum/solidity/releases/download/v${SOLC_VERSION}/solc-static-linux" \
            -o "$RUNNER_TEMP/solc/solc-${SOLC_VERSION}"
          chmod +x "$RUNNER_TEMP/solc/solc-${SOLC_VERSION}"
          "$RUNNER_TEMP/solc/solc-${SOLC_VERSION}" --version

      - name: Build Solar
        run: cargo build --release -p solar-compiler --bin solar

      - name: Download baseline (${{ env.BASE_BRANCH }} branch)
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/codegen-bench/baseline

          run_ids="$(
            gh run list \
              --workflow bench.yml \
              --branch "$BASE_BRANCH" \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId' \
              2>/dev/null || true
          )"
          if [[ -z "$run_ids" ]]; then
            echo "::warning::No successful $BASE_BRANCH benchmark run was found for baseline comparison"
            exit 0
          fi

          for run_id in $run_ids; do
            if gh run download "$run_id" \
              --name codegen-runtime-baseline \
              --dir target/codegen-bench/baseline \
              2>/dev/null && [[ -f target/codegen-bench/baseline/results.json ]]; then
              exit 0
            fi
            if gh run download "$run_id" \
              --name codegen-runtime-results \
              --dir target/codegen-bench/baseline \
              2>/dev/null && [[ -f target/codegen-bench/baseline/results.json ]]; then
              exit 0
            fi
          done

          echo "::warning::No $BASE_BRANCH baseline artifact was available for comparison"

      - name: Run codegen benchmark
        id: codegen-bench
        run: |
          set -euo pipefail
          mkdir -p target/codegen-bench
          if ! python3 benches/runtime/benchmark.py --verbose \
            --solc "$RUNNER_TEMP/solc/solc-${SOLC_VERSION}" \
            --solar target/release/solar \
            --suite all \
            --compile-repeats 5 \
            --gas \
            --gas-profile hot \
            --start-anvil \
            --allow-failures \
            --output target/codegen-bench/results.json; then
            echo "::warning::Codegen benchmark failed to complete"
          fi

      - name: Generate runtime benchmark report
        id: runtime-report
        if: always()
        env:
          BENCHMARK_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BENCHMARK_PR_NUMBER: ${{ github.event.pull_request.number }}
          BENCHMARK_BASE_REF: ${{ env.BASE_BRANCH }}
        run: |
          set -euo pipefail
          mkdir -p target/codegen-bench
          args=(
            --results target/codegen-bench/results.json
            --common-output target/codegen-bench/common.json
            --report-output target/codegen-bench/report.md
            --ignore-compile-time-changes
          )
          if [[ -f target/codegen-bench/baseline/results.json ]]; then
            args+=(--baseline target/codegen-bench/baseline/results.json)
          fi
          python3 benches/runtime/report.py "${args[@]}"

      - name: Comment on PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: codegen-runtime-bench
          message: ${{ steps.runtime-report.outputs.report }}
          only_update: ${{ steps.runtime-report.outputs.should_comment != 'true' }}

      - name: Save comment metadata
        if: always() && github.event_name == 'pull_request'
        env:
          SHOULD_COMMENT: ${{ steps.runtime-report.outputs.should_comment }}
        run: echo "$SHOULD_COMMENT" > target/codegen-bench/should-comment

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codegen-runtime-results
          path: target/codegen-bench/
          retention-days: 30
          if-no-files-found: ignore

      - name: Save baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codegen-runtime-baseline
          path: target/codegen-bench/results.json
          retention-days: 90
          if-no-files-found: ignore

  codspeed:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.benchmark == 'all' ||
      inputs.benchmark == 'codspeed'
    runs-on: depot-ubuntu-latest-4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Checkout submodules
        run: git submodule update --checkout
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          cache-on-failure: true
          cache-targets: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install cargo-codspeed
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-codspeed
      - name: Build the benchmark targets
        run: >-
          cargo codspeed build -m simulation --profile profiling
          -p solar-bench -p solar-lsp
          --bench criterion --bench lsp
          --features solar-lsp/bench
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          run: >-
            cargo codspeed run -m simulation
            -p solar-bench -p solar-lsp
            --bench criterion --bench lsp
          mode: simulation
          token: ${{ secrets.CODSPEED_TOKEN }}

  gungraun:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.benchmark == 'all' ||
      inputs.benchmark == 'gungraun'
    runs-on: depot-ubuntu-latest-4
    permissions:
      contents: read
    env:
      BASELINE: base
      COMPARISON_REF: ${{ inputs.comparison_ref || github.base_ref || 'main' }}
      IAI_CALLGRIND_RUNNER: iai-callgrind-runner
      GUNGRAUN_RUNNER: gungraun-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Checkout submodules
        run: git submodule update --checkout
      - name: Install Valgrind
        run: sudo apt update && sudo apt install valgrind
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Install cargo-binstall
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-binstall
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMPARISON_REF }}
          fetch-depth: 2
      - name: Checkout HEAD^
        if: github.event_name == 'push'
        run: git checkout HEAD^
      - name: Checkout base submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --checkout
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          cache-on-failure: true
          cache-targets: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install benchmark runner
        run: |
          package=$(cargo metadata --format-version=1 | jq -r '.packages[] | select(.name == "gungraun" or .name == "iai-callgrind").name' | head -n1)
          version=$(cargo metadata --format-version=1 | jq -r --arg package "$package" '.packages[] | select(.name == $package).version')
          case "$package" in
            gungraun) runner=gungraun-runner ;;
            iai-callgrind) runner=iai-callgrind-runner ;;
            *) echo "unknown benchmark runner package: $package" && exit 1 ;;
          esac
          cargo binstall "$runner" --version "$version" --no-confirm --no-symlinks --force
          which "$runner"
      - name: Save baseline
        run: |
          bench_target=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "solar-bench").targets[] | select(any(.kind[]; . == "bench") and (.name == "gungraun" or .name == "iai")).name' | head -n1)
          cargo bench -p solar-bench --bench "$bench_target" --features ci -- --save-baseline="$BASELINE"
          if [ "$bench_target" = "iai" ] && [ -d target/iai ] && [ ! -e target/gungraun ]; then
            mv target/iai target/gungraun
          fi
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - name: Checkout candidate submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --checkout
      - name: Install benchmark runner
        run: |
          version=$(cargo metadata --format-version=1 | jq -r '.packages[] | select(.name == "gungraun").version')
          cargo binstall gungraun-runner --version "$version" --no-confirm --no-symlinks --force
          which gungraun-runner
      - name: Compare candidate benchmarks
        run: cargo bench -p solar-bench --bench gungraun --features ci -- --baseline="$BASELINE"
