# Only the pinned dependency updater on main may create dependency PRs.
subject:
  - repo:paradigmxyz/solar:ref:refs/heads/main
  - repo:paradigmxyz@97369466/solar@631030757:ref:refs/heads/main

claim_pattern:
  repository_id: '631030757'
  event_name: '(schedule|workflow_dispatch)'
  workflow_ref: 'paradigmxyz/solar/\.github/workflows/dependencies\.yml@refs/heads/main'
  job_workflow_ref: 'tempoxyz/gh-actions/\.github/workflows/cargo-update-pr\.yml@b5c4ebd2f59f0c41d7663e2e84b713527321a35e'

permissions:
  contents: write
  pull_requests: write
