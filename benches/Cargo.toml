[package]
name = "solar-bench"
description = "Simple benchmarks across different Solidity parser implementations"
homepage = "https://github.com/paradigmxyz/solar/tree/main/benches"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
solar = { workspace = true, features = ["codegen"] }

flate2.workspace = true
serde_json.workspace = true

# others
semver = { workspace = true, optional = true }
slang_solidity = { version = "=0.18.3", optional = true }
solang-parser = { version = "=0.3.4", optional = true }
tree-sitter = { version = "=0.25.8", optional = true }
tree-sitter-solidity = { version = "=1.2.12", optional = true }

[dev-dependencies]
criterion.workspace = true

[features]
ci = []
others = [
    "dep:semver",
    "dep:slang_solidity",
    "dep:solang-parser",
    "dep:tree-sitter",
    "dep:tree-sitter-solidity",
]

[[bench]]
name = "criterion"
path = "benches/criterion.rs"
harness = false
