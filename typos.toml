[files]
extend-exclude = [
    ".git",
    "target",
    "testdata",
    "Cargo.toml",
    "Cargo.lock",
    "CHANGELOG.md",
    "*.json",
    "**/tests/**",
    "**/test/**",
    "**/*_test.*",
    "**/*_tests.*",
    "crates/parse/src/lexer/unicode_chars.rs", # Weird words.
    "dist-workspace.toml",
]

[default]
# Hand-written Lean proofs are named after a hex digest of their rule.
extend-ignore-identifiers-re = ["[a-z_]+_[0-9a-f]{16}(_[0-9]+)?"]

[default.extend-words]
ket = "ket"
Mke = "Mke"
numer = "numer"
Pn = "Pn"
typ = "typ"

[type.py.extend-identifiers]
som = "som"
