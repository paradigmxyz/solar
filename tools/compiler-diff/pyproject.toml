[project]
name = "solar-compiler-diff"
version = "0.1.0"
description = "Compile Solidity corpora and compare compiler artifacts"
requires-python = ">=3.14"
dependencies = ["duckdb==1.5.0"]

[project.scripts]
compiler-diff = "compiler_diff.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["compiler_diff"]
