# Differential fuzzing of Uniswap v2-core builds with Foundry; see ../README.md.
# Pinned toolchain: Foundry nightly 1.9.1-nightly, commit 5717c1b8fea92d59da287e56e8b6c798a3a36e74
# (foundryup --install nightly-5717c1b8fea92d59da287e56e8b6c798a3a36e74). Run setup.sh first.
[profile.default]
solc = "0.8.24"
evm_version = "cancun"
src = "src"
test = "test"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./lib/uniswap-v2" }]

[fuzz]
runs = 1000
seed = "0x2b2"

[invariant]
runs = 64
depth = 32
