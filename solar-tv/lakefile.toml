name = "solar_tv"
defaultTargets = ["SolarTV"]

[[require]]
name = "evm_rules"
path = "../scripts/evm-rules/lean"

[[lean_lib]]
name = "SolarTV"

# The stages of the w1 milestone, which milestone/w1/gen.sh exports, and their checks.
[[lean_lib]]
name = "W1"
srcDir = "milestone/w1"
roots = ["W1"]
globs = ["W1.+", "gen.+"]

# Kernel proofs of w1's stages.
[[lean_lib]]
name = "W1Proofs"
srcDir = "milestone/w1/proofs"
# Symbolic execution is heavy: fail on running out of memory rather than exhaust the machine.
moreLeanArgs = ["-M", "3000"]

# counter: the stages of milestone/counter/counter.sol's Counter and their kernel proofs, which
# milestone/certify.sh writes.
[[lean_lib]]
name = "counter"
srcDir = "milestone"
roots = ["counter.Proofs"]
globs = ["counter.+"]
moreLeanArgs = ["-M", "3000"]

# w4: the stages of milestone/w4/w4.sol's Main and their kernel proofs, which
