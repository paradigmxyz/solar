[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }
status-level = "leak"

# The UI harness runs thousands of compiler invocations in parallel itself, and prints the real
# fixture count in its own `test result:` line, which nextest hides on a pass by default. The stable
# CI job's EVM IR check (`SOLAR_RUN_CALL_EVM_IR`) roughly doubles the suite, which then takes over
# 10 minutes on slower CI runners; the harness still times out each hung compiler run on its own.
[[profile.default.overrides]]
filter = 'package(solar-compiler) & test(=ui_test)'
threads-required = "num-test-threads"
success-output = "final"
slow-timeout = { period = "60s", terminate-after = 20 }

# The Foundry suite runs solc once and the compiler at three optimization levels for every project.
[[profile.default.overrides]]
filter = 'package(solar-compiler) & binary(it) & test(=foundry::foundry)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The external Foundry suite compiles and tests whole real-world projects;
# warn instead of terminating (no `terminate-after`).
[[profile.default.overrides]]
filter = 'package(solar-compiler) & binary(it) & test(=foundry::external)'
slow-timeout = { period = "2h" }

[profile.ci]
fail-fast = false
status-level = "all"
