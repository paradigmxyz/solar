[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }
status-level = "leak"

# The UI harness runs thousands of compiler invocations in parallel itself, and prints the real
# fixture count in its own `test result:` line, which nextest hides on a pass by default.
[[profile.default.overrides]]
filter = 'package(solar-compiler) & test(=ui_test)'
threads-required = "num-test-threads"
success-output = "final"
slow-timeout = { period = "60s", terminate-after = 10 }

# The Foundry suite runs solc once and the compiler at three optimization levels for every project.
[[profile.default.overrides]]
filter = 'package(solar-compiler) & binary(it) & test(=foundry::foundry)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The external Foundry suite compiles and tests whole real-world projects;
# warn instead of terminating (no `terminate-after`).
[[profile.default.overrides]]
filter = 'package(solar-compiler) & binary(it) & test(=foundry::external)'
slow-timeout = { period = "2h" }

# The export test compiles every codegen UI test four to six times; give it ten minutes.
[[profile.default.overrides]]
filter = 'package(solar-compiler) & binary(it) & test(=lean_export::export_keeps_bytecode_and_is_deterministic)'
slow-timeout = { period = "60s", terminate-after = 10 }

# The prover corpus prints why it skips when z3 is missing; show it on a pass.
[[profile.default.overrides]]
filter = 'package(solar-prove-analyses)'
success-output = "final"

# The verifier's solver tests print why they skip when z3 is missing; show it on a pass.
[[profile.default.overrides]]
filter = 'package(solar-verify)'
success-output = "final"

[profile.ci]
fail-fast = false
status-level = "all"
