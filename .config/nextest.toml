[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }
status-level = "leak"

# The UI harness runs thousands of compiler invocations in parallel itself.
[[profile.default.overrides]]
filter = 'package(solar-compiler) & test(=ui_test)'
threads-required = "num-test-threads"

# The external Foundry suite compiles and tests whole real-world projects;
# warn instead of terminating (no `terminate-after`).
[[profile.default.overrides]]
filter = 'package(solar-tester) & test(foundry::tests::external)'
slow-timeout = { period = "2h" }

[profile.ci]
fail-fast = false
status-level = "all"
