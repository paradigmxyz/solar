[project]
name = "solar-python"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false
# Isolated build dependencies are resolved outside uv.lock, even with --locked.
build-constraint-dependencies = [
    "editables==0.6",
    "hatchling==1.32.4",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.9.21.13",
]

[tool.uv.workspace]
members = ["tools/compiler-diff", "benches/analyze"]

[dependency-groups]
dev = ["ruff", "ty", "jsonschema==4.25.1", "pytest", "pytest-xdist"]

[tool.ty.environment]
extra-paths = ["tools/compiler-diff"]

[tool.ty.src]
exclude = ["testdata"]
