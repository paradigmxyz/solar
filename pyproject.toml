[project]
name = "solar-python"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["tools/compiler-diff", "benches/analyze"]

[dependency-groups]
dev = ["ruff", "ty", "jsonschema==4.25.1", "z3-solver==4.16.0.0"]

[tool.ty.environment]
extra-paths = ["tools/compiler-diff"]

[tool.ty.src]
exclude = ["testdata"]
