# Configuration file for [`git-cliff`](https://github.com/orhun/git-cliff)
# See https://git-cliff.org/docs/configuration

[remote.github]
owner = "paradigmxyz"
repo = "solar"

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# https://keats.github.io/tera/docs/#introduction
body = """\
{% set gh_link = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo %}\
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}]({{ gh_link }}/releases/tag/v{{ version | trim_start_matches(pat="v") }})
{% elif previous %}\
    ## [Unreleased]({{ gh_link }}/compare/{{ previous.version }}...HEAD)
{% else %}\
    ## Unreleased
{% endif %}\
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% if breaking | length > 0 %}
    ### Breaking changes
    {% for commit in breaking %}
        - {% if commit.scope %}[{{ commit.scope }}] {% endif %}{{ commit.message | upper_first | split(pat="\\n") | first }}\
    {% endfor %}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}[{{ commit.scope }}] {% endif %}{{ commit.message | upper_first | split(pat="\\n") | first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = false
commit_preprocessors = [
    { pattern = '#(\d+)', replace = "[#$1](https://github.com/paradigmxyz/solar/issues/$1)" },
]
commit_parsers = [
    # Drop what users never see: tooling scopes, and non-user-facing types.
    { field = "scope", pattern = "^(bench|tester|compiler-diff|debugify|solsymdiff|fuzz|deps|ci|test|tests)$", skip = true },
    { message = "^Merge", skip = true },
    { message = "^(chore|ci|test|refactor|style|revert|docs?)\\b", skip = true },

    # Areas, first match wins. Keep the numeric comments: they order the sections.
    { message = "(?i)^(feat|fix)(\\(.*\\))?!?: .*(debug|origin|source ?map|\\bspans?\\b|coverage|\\bmaps?\\b)", group = "<!-- 40 -->Debug info and coverage" },
    { message = "(?i)^(feat|fix)(\\(.*\\))?!?: .*(natspec|\\bast\\b|\\babi\\b|metadata|storage layout|userdoc|devdoc)", group = "<!-- 50 -->Output: ABI, AST, NatSpec and metadata" },
    { field = "scope", pattern = "^lsp$", group = "<!-- 80 -->Language server" },
    { message = "^perf(\\((sema|cli|parse|interface|config|ast|lint)\\))?!?:", group = "<!-- 60 -->Compile time and memory" },
    { message = "^perf", group = "<!-- 30 -->Code generation: gas and size" },
    { field = "scope", pattern = "^(cli|config|interface)$", group = "<!-- 70 -->CLI and Standard JSON" },
    { field = "scope", pattern = "^(sema|parse|ast|lint|lexer)$", group = "<!-- 20 -->Language and diagnostics" },
    { field = "scope", pattern = "^(codegen|mir|evmir|ir|inline)$", group = "<!-- 35 -->Code generation: features and fixes" },

    { message = ".*", group = "<!-- 90 -->Other" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = 'v0\.1\.0'
ignore_tags = "rc"
sort_commits = "newest"
